<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Stats</title>
    <link rel="stylesheet" href="lab5.css">

</head>

<body>
    <div class="container">
        <header>
            <h1>NBA Player Stats</h1>
            <button id="dark-mode-toggle">Toggle Dark Mode</button>
        </header>

        <search class="table-filters">
            <input type="text" id="search" placeholder="Search players...">
            <select id="team-filter">
                <option value="all">All</option>
                <!-- Teams will be populated in JS -->
            </select>
        </search>

        <table id="player-stats">
            <thead>
              <tr>
                <th onclick="sort(this)">Name <span class="asc"></span></th>
                <th onclick="sort(this)">Team <span class="asc"></span></th>
                <th onclick="sort(this)">Points <span class="asc"></span></th>
                <th onclick="sort(this)">Rebounds <span class="asc"></span></th>
                <th onclick="sort(this)">Assists <span class="asc"></span></th>
             </tr>
            </thead>
            <tbody id="player-rows">
                <!-- Rows will be populated in JS -->
            </tbody>
        </table>
    </div>
    <script src="lab5.js"></script>
</body>

</html>
